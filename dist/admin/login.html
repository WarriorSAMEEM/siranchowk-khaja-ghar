    <style>:root{--bg-1:#eafcff;--bg-2:#dff7f7;--bg-3:#f5fcfc;--text:#102a2e;--muted:#647b7f;--primary:#159ca5;--primary-dark:#087f89;--border:#159ca52e;--glass:#ffffffad;--danger:#c0392b}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%}body{min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 20%, #5bdce247, transparent 30%), radial-gradient(circle at 85% 80%, #53bec838, transparent 30%), linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));justify-content:center;align-items:center;padding:24px;font-family:Inter,sans-serif;display:flex;position:relative;overflow-x:hidden}body:before,body:after{content:"";z-index:0;pointer-events:none;filter:blur(2px);opacity:.45;position:fixed}body:before{background:linear-gradient(135deg,#4acad342,#ffffff0d);border-radius:48% 52% 63% 37%/44% 38% 62% 56%;width:420px;height:420px;top:-180px;left:-140px;transform:rotate(18deg)}body:after{background:linear-gradient(135deg,#159ca52e,#ffffff0a);border-radius:57% 43% 34% 66%/48% 59% 41% 52%;width:480px;height:480px;bottom:-210px;right:-200px;transform:rotate(-22deg)}.login-wrapper{z-index:2;width:100%;max-width:440px;position:relative}.login-card{border:1px solid var(--border);background:var(--glass);-webkit-backdrop-filter:blur(24px);border-radius:28px;width:100%;padding:38px;animation:.65s both cardIn;box-shadow:0 30px 80px #10484d21,0 8px 25px #10484d0f}@keyframes cardIn{0%{opacity:0;transform:translateY(20px)scale(.98)}to{opacity:1;transform:translateY(0)scale(1)}}.brand{text-align:center;margin-bottom:30px}.shield{background:linear-gradient(135deg,#159ca529,#ffffffb8);border:1px solid #159ca52e;border-radius:20px;justify-content:center;align-items:center;width:68px;height:68px;margin:0 auto 18px;display:flex;box-shadow:0 12px 30px #159ca51f}.shield span{font-size:29px}.brand h1{letter-spacing:-.5px;font-size:25px;font-weight:800}.brand p{color:var(--muted);margin-top:8px;font-size:13px;line-height:1.6}.form-group{margin-bottom:20px}.form-group label{margin-bottom:8px;font-size:13px;font-weight:700;display:block}.input-wrapper{position:relative}.input-wrapper input{width:100%;height:54px;color:var(--text);font:inherit;background:#ffffffa8;border:1px solid #102a2e1f;border-radius:14px;outline:none;padding:0 16px 0 17px;font-size:14px;transition:border-color .25s,box-shadow .25s,background .25s}.input-wrapper input::placeholder{color:#91a4a7}.input-wrapper input:focus{background:#ffffffe6;border-color:#159ca5a6;box-shadow:0 0 0 4px #159ca51c,0 8px 25px #159ca512}.password-toggle{color:#71888c;cursor:pointer;background:0 0;border:0;padding:7px;font-size:13px;font-weight:600;position:absolute;top:50%;right:14px;transform:translateY(-50%)}.password-toggle:hover{color:var(--primary-dark)}.submit-btn{background:linear-gradient(135deg, var(--primary), var(--primary-dark));color:#fff;cursor:pointer;border:0;border-radius:14px;justify-content:center;align-items:center;gap:10px;width:100%;height:54px;margin-top:6px;font-family:inherit;font-size:14px;font-weight:700;transition:transform .2s,box-shadow .2s,opacity .2s;display:flex;box-shadow:0 12px 25px #159ca538}.submit-btn:hover{transform:translateY(-2px);box-shadow:0 17px 34px #159ca545}.submit-btn:active{transform:translateY(0)}.submit-btn:disabled{cursor:not-allowed;opacity:.65;transform:none}.error-alert{color:var(--danger);background:#c0392b12;border:1px solid #c0392b2e;border-radius:12px;margin-bottom:18px;padding:12px 14px;font-size:12px;line-height:1.5;display:none}.error-alert.show{animation:.3s shake;display:block}@keyframes shake{0%,to{transform:translate(0)}25%{transform:translate(-5px)}75%{transform:translate(5px)}}.security-note{text-align:center;color:#7b8f92;margin-top:23px;font-size:11px;line-height:1.6}.security-note strong{color:#557276}.loading{justify-content:center;align-items:center;gap:8px;display:none}.loading.active{display:flex}.loading-dot{background:#fff;border-radius:50%;width:7px;height:7px;animation:.8s infinite alternate loading}.loading-dot:nth-child(2){animation-delay:.15s}.loading-dot:nth-child(3){animation-delay:.3s}@keyframes loading{0%{opacity:.3;transform:translateY(0)}to{opacity:1;transform:translateY(-3px)}}@media (width<=520px){body{padding:16px}.login-card{border-radius:23px;padding:28px 22px}.brand h1{font-size:22px}}</style>

  <script type="module" crossorigin src="/assets/adminLogin-CrSyyt--.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/firebase-Cqo9gZKS.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-D3oEsBym.js">

<body>


    <main class="login-wrapper">

        <section class="login-card">


            <!-- ============================================================
                 BRAND
            ============================================================= -->

            <div class="brand">

                <div
                    class="shield"
                    aria-hidden="true"
                >
                    <span>🛡️</span>
                </div>


                <h1>
                    Admin Portal
                </h1>


                <p>
                    Siranchowk Khaja Ghar
                    <br>
                    Secure Management System
                </p>

            </div>


            <!-- ============================================================
                 ERROR MESSAGE

                 IMPORTANT:
                 IDs must match login-handler.js
            ============================================================= -->

            <div
                id="login-error"
                class="error-alert"
                role="alert"
                aria-live="polite"
            >

                <span id="error-text">
                    Invalid email or password.
                </span>

            </div>


            <!-- ============================================================
                 LOGIN FORM
            ============================================================= -->

            <form
                id="admin-login-form"
                novalidate
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="admin-email">
                        Email Address
                    </label>


                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="admin-email"
                            name="email"
                            placeholder="admin@example.com"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>


                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="admin-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="toggle-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn"
                    id="btn-submit"
                >

                    <span id="submit-text">
                        Sign in securely
                    </span>


                    <span
                        id="loading"
                        class="loading"
                        aria-hidden="true"
                    >

                        <span class="loading-dot"></span>

                        <span class="loading-dot"></span>

                        <span class="loading-dot"></span>

                    </span>

                </button>

            </form>


            <!-- ============================================================
                 SECURITY NOTE
            ============================================================= -->

            <p class="security-note">

                🔒

                <strong>
                    Protected area.
                </strong>

                Authorized administrators only.

            </p>


        </section>

    </main>
