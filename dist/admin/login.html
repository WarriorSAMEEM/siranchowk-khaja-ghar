<body>
    <main class="page" id="login-page">
        <div class="grain" aria-hidden="true"></div>
        <div class="background-lines" aria-hidden="true"></div>
        <div class="orb" aria-hidden="true"></div>
        <div class="orb-ring" aria-hidden="true"></div>

        <div class="corner-mark" aria-hidden="true">
            <span>Secure Admin</span>
        </div>

        <section class="login-wrapper" aria-label="Administrator login">
            <div class="login-card" id="login-card">
                <span class="card-line" aria-hidden="true"></span>

                <!-- ========================================================
                     BRAND
                ========================================================= -->
                <header class="brand">
                    <div class="brand-mark" aria-hidden="true">
                        <span class="shield-icon"></span>
                    </div>

                    <h1>Admin Portal</h1>

                    <p>
                        Siranchowk Khaja Ghar
                        <br>
                        Secure Management System
                    </p>
                </header>

                <!-- ========================================================
                     SECURITY STATUS
                ========================================================= -->
                <div class="secure-status" aria-label="Secure connection">
                    <span class="secure-status-dot"></span>
                    <span>Protected administrator access</span>
                </div>

                <!-- ========================================================
                     ERROR MESSAGE

                     IMPORTANT:
                     IDs are preserved for login-handler.js.
                ========================================================= -->
                <div
                    id="login-error"
                    class="error-alert"
                    role="alert"
                    aria-live="polite"
                >
                    <span id="error-text">
                        Invalid email or password.
                    </span>
                </div>

                <!-- ========================================================
                     LOGIN FORM

                     IMPORTANT:
                     These IDs/names are preserved:
                     - admin-login-form
                     - admin-email
                     - admin-password
                     - toggle-password
                     - btn-submit
                     - submit-text
                     - loading
                ========================================================= -->
                <form
                    id="admin-login-form"
                    class="login-form"
                    novalidate
                >
                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="admin-email">
                            <span>Email Address</span>
                            <span class="field-hint">Required</span>
                        </label>

                        <div class="input-wrapper">
                            <input
                                type="email"
                                id="admin-email"
                                name="email"
                                placeholder="admin@example.com"
                                autocomplete="username"
                                inputmode="email"
                                spellcheck="false"
                                required
                            >
                        </div>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">
                        <label for="admin-password">
                            <span>Password</span>
                            <span class="field-hint">Min. 6 characters</span>
                        </label>

                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="admin-password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggle-password"
                                aria-label="Show password"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="submit-btn"
                        id="btn-submit"
                    >
                        <span id="submit-text">
                            Sign in securely
                        </span>

                        <span
                            id="loading"
                            class="loading"
                            aria-hidden="true"
                        >
                            <span class="loading-dot"></span>
                            <span class="loading-dot"></span>
                            <span class="loading-dot"></span>
                        </span>
                    </button>
                </form>

                <!-- ========================================================
                     SECURITY NOTE
                ========================================================= -->
                <p class="security-note">
                    <span
                        class="security-icon"
                        aria-hidden="true"
                    ></span>

                    <span>
                        <strong>Protected area.</strong>
                        Authorized administrators only.
                    </span>
                </p>
            </div>
        </section>

        <div class="footer-meta" aria-hidden="true">
            SIRANCHOWK <span>•</span> PRIVATE ADMIN ACCESS
        </div>
    </main>

    <!-- ================================================================
         EXISTING AUTHENTICATION HANDLER

         DO NOT REMOVE OR RENAME.
         Vite bundles Firebase dependencies automatically.
    ================================================================= -->

    <!-- ================================================================
         VISUAL MICRO-INTERACTIONS

         This script ONLY controls visual effects:
         - Cursor-responsive border/glow
         - Tiny card tilt/parallax
         - Input glow position

         It does NOT perform authentication.
    ================================================================= -->
    <script>
        (() => {
            "use strict";

            const page = document.getElementById("login-page");
            const card = document.getElementById("login-card");

            if (!page || !card) {
                return;
            }

            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );

            const coarsePointer = window.matchMedia(
                "(hover: none) and (pointer: coarse)"
            );

            let frame = 0;

            function updatePointer(event) {
                if (reducedMotion.matches || coarsePointer.matches) {
                    return;
                }

                const rect = card.getBoundingClientRect();

                const x = event.clientX;
                const y = event.clientY;

                const localX = x - rect.left;
                const localY = y - rect.top;

                const percentX = (localX / rect.width) * 100;
                const percentY = (localY / rect.height) * 100;

                const normalizedX =
                    (localX / rect.width - 0.5);

                const normalizedY =
                    (localY / rect.height - 0.5);

                const rotateY =
                    normalizedX * 2.6;

                const rotateX =
                    normalizedY * -2.6;

                cancelAnimationFrame(frame);

                frame = requestAnimationFrame(() => {
                    document.documentElement.style.setProperty(
                        "--cursor-x",
                        `${(x / window.innerWidth) * 100}%`
                    );

                    document.documentElement.style.setProperty(
                        "--cursor-y",
                        `${(y / window.innerHeight) * 100}%`
                    );

                    card.style.setProperty(
                        "--mouse-glow-x",
                        `${percentX}%`
                    );

                    card.style.setProperty(
                        "--mouse-glow-y",
                        `${percentY}%`
                    );

                    card.style.setProperty(
                        "--tilt-x",
                        `${rotateX}deg`
                    );

                    card.style.setProperty(
                        "--tilt-y",
                        `${rotateY}deg`
                    );
                });
            }

            function resetCard() {
                if (reducedMotion.matches || coarsePointer.matches) {
                    return;
                }

                card.style.setProperty(
                    "--tilt-x",
                    "0deg"
                );

                card.style.setProperty(
                    "--tilt-y",
                    "0deg"
                );

                card.style.setProperty(
                    "--mouse-glow-x",
                    "50%"
                );

                card.style.setProperty(
                    "--mouse-glow-y",
                    "50%"
                );
            }

            function updateFieldGlow(event) {
                const wrapper = event.currentTarget;

                const rect =
                    wrapper.getBoundingClientRect();

                const x =
                    ((event.clientX - rect.left) / rect.width) *
                    100;

                const y =
                    ((event.clientY - rect.top) / rect.height) *
                    100;

                wrapper.style.setProperty(
                    "--field-x",
                    `${x}%`
                );

                wrapper.style.setProperty(
                    "--field-y",
                    `${y}%`
                );
            }

            window.addEventListener(
                "pointermove",
                updatePointer,
                { passive: true }
            );

            card.addEventListener(
                "pointerleave",
                resetCard
            );

            document
                .querySelectorAll(".input-wrapper")
                .forEach((wrapper) => {
                    wrapper.addEventListener(
                        "pointermove",
                        updateFieldGlow,
                        { passive: true }
                    );
                });

            reducedMotion.addEventListener?.(
                "change",
                () => {
                    if (reducedMotion.matches) {
                        resetCard();
                    }
                }
            );
        })();





        const passwordInput = document.getElementById("admin-password");
    const togglePassword = document.getElementById("toggle-password");

    togglePassword.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";

        togglePassword.textContent = isHidden ? "Hide" : "Show";

        togglePassword.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
    });
    </script>
</body>
</html>
